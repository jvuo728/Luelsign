# Development docker-compose - runs Next.js dev server in Docker
services:
  postgres:
    image: postgres:16-alpine
    container_name: luel-postgres-dev
    environment:
      POSTGRES_USER: luel_user
      POSTGRES_PASSWORD: luel_password
      POSTGRES_DB: luel_esign
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Luel-esign.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luel_user -d luel_esign"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: node:20-alpine
    container_name: luel-app-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://luel_user:luel_password@postgres:5432/luel_esign
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
