services:
  postgres:
    image: postgres:16-alpine
    container_name: luel-postgres
    environment:
      POSTGRES_USER: luel_user
      POSTGRES_PASSWORD: luel_password
      POSTGRES_DB: luel_esign
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Luel-esign.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luel_user -d luel_esign"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
